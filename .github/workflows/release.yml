name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test, Package & Verify (Windows JDK 21)
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify git tag matches Gradle project version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tagVersion = $env:REF_NAME.TrimStart('v')
          $match = Select-String -Path "build.gradle.kts" -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $match) {
            Write-Error "Could not read project version from build.gradle.kts"
            exit 1
          }
          $gradleVersion = $match.Matches[0].Groups[1].Value
          if ($tagVersion -ne $gradleVersion) {
            Write-Error "Tag version '$tagVersion' (from '$env:REF_NAME') does not match Gradle project version '$gradleVersion' in build.gradle.kts."
            exit 1
          }
          Write-Host "Verified tag version matches Gradle version: $gradleVersion"

      - name: Ensure WiX Toolset v3 is available
        shell: pwsh
        run: |
          $candle = Get-Command candle.exe -ErrorAction SilentlyContinue
          $light = Get-Command light.exe -ErrorAction SilentlyContinue
          if ($candle -and $light) {
            Write-Host "WiX Toolset v3 already on PATH: $($candle.Source)"
            exit 0
          }

          $existingWixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "bin" } |
            Where-Object { (Test-Path (Join-Path $_ "candle.exe")) -and (Test-Path (Join-Path $_ "light.exe")) } |
            Select-Object -First 1

          if (-not $existingWixBin) {
            Write-Host "Installing WiX Toolset v3 via Chocolatey..."
            choco install wixtoolset -y --no-progress
            if ($LASTEXITCODE -ne 0) {
              throw "Chocolatey failed to install wixtoolset (exit code $LASTEXITCODE)"
            }
            $existingWixBin = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*" -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending |
              ForEach-Object { Join-Path $_.FullName "bin" } |
              Where-Object { (Test-Path (Join-Path $_ "candle.exe")) -and (Test-Path (Join-Path $_ "light.exe")) } |
              Select-Object -First 1
          }

          if (-not $existingWixBin) {
            throw "WiX Toolset v3 (candle.exe / light.exe) could not be located after installation."
          }

          Write-Host "Adding WiX bin directory to PATH: $existingWixBin"
          Add-Content -Path $env:GITHUB_PATH -Value $existingWixBin

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests
        shell: pwsh
        run: .\gradlew.bat test --no-daemon

      - name: Build installer, portable ZIP, and checksums
        shell: pwsh
        run: .\gradlew.bat packagePortableZip packageInstallerExe generateChecksums -PrequireWix=true --no-daemon

      - name: Verify packaged artifacts and run --self-check
        shell: pwsh
        run: .\scripts\verify-package.ps1 -RequireInstaller

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tidyflow-release-assets
          path: |
            build/installer/TidyFlow-*.exe
            build/installer/TidyFlow-*-portable.zip
            build/installer/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Create GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: tidyflow-release-assets
          path: release-assets

      - name: Verify all three release files are present
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "release-assets" -File
          $files | Format-Table Name, Length
          if ($files.Count -ne 3) {
            throw "Expected exactly 3 release files (.exe, -portable.zip, SHA256SUMS.txt), found $($files.Count)"
          }

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          $assets = (Get-ChildItem -Path "release-assets" -File).FullName
          gh release create $env:TAG_NAME $assets --repo $env:REPO --verify-tag --generate-notes
